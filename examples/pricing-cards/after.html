<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>After</title>
<style>
  :root {
    --space: 1rem;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
    --primary-600: #4f46e5;
  }

  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    margin: 0;
    padding: calc(var(--space) * 1.25);
  }

  .plans {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space);
    max-width: 680px;
    align-items: start;
  }

  .plan {
    padding: calc(var(--space) * 1.25);
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
  }

  .plan.featured {
    border: 2px solid var(--primary-600);
    box-shadow: 0 4px 16px rgba(79, 70, 229, 0.15);
    transform: translateY(-0.5rem);
  }

  .featured-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--primary-600);
    background: #eef2ff;
    padding: 0.125rem 0.5rem;
    border-radius: 999px;
    margin-bottom: calc(var(--space) * 0.5);
  }

  .plan-name {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--gray-700);
    margin: 0 0 calc(var(--space) * 0.25);
  }

  .plan-price {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--gray-900);
    margin: 0 0 var(--space);
  }

  .plan-price span {
    font-size: 0.9375rem;
    font-weight: 400;
    color: var(--gray-500);
  }

  .plan ul {
    list-style: none;
    padding: 0;
    margin: 0 0 var(--space);
    font-size: 0.875rem;
    color: var(--gray-700);
  }

  .plan li {
    padding: calc(var(--space) * 0.25) 0;
  }

  .plan button {
    width: 100%;
    padding: 0.625rem;
    border: 1px solid var(--primary-600);
    border-radius: 6px;
    background: white;
    color: var(--primary-600);
    font-size: 0.875rem;
    font-weight: 500;
  }

  .plan.featured button {
    background: var(--primary-600);
    color: white;
    border-color: var(--primary-600);
  }
</style>
</head>
<body>
  <div class="plans">
    <div class="plan">
      <p class="plan-name">Starter</p>
      <p class="plan-price">$9<span>/mo</span></p>
      <ul><li>1 project</li><li>Community support</li></ul>
      <button>Choose plan</button>
    </div>
    <div class="plan featured">
      <span class="featured-tag">Most popular</span>
      <p class="plan-name">Growth</p>
      <p class="plan-price">$29<span>/mo</span></p>
      <ul><li>10 projects</li><li>Email support</li></ul>
      <button>Choose plan</button>
    </div>
    <div class="plan">
      <p class="plan-name">Scale</p>
      <p class="plan-price">$79<span>/mo</span></p>
      <ul><li>Unlimited projects</li><li>Priority support</li></ul>
      <button>Choose plan</button>
    </div>
  </div>
</body>
</html>
