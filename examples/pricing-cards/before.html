<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before</title>
<style>
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    margin: 0;
    padding: 20px;
  }

  .plans {
    display: flex;
    gap: 12px;
  }

  .plan {
    width: 200px;
    padding: 16px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 4px;
  }

  .plan-name {
    font-size: 15px;
    font-weight: 400;
    margin: 0 0 4px;
  }

  .plan-price {
    font-size: 17px;
    font-weight: 400;
    color: #9ca3af;
    margin: 0 0 8px;
  }

  .plan ul {
    padding-left: 16px;
    margin: 0 0 10px;
    font-size: 13px;
    color: #6b7280;
  }

  .plan button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 4px;
    background: #10b981;
    color: white;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="plans">
    <div class="plan">
      <p class="plan-name">Starter</p>
      <p class="plan-price">$9/mo</p>
      <ul><li>1 project</li><li>Community support</li></ul>
      <button>Choose plan</button>
    </div>
    <div class="plan">
      <p class="plan-name">Growth</p>
      <p class="plan-price">$29/mo</p>
      <ul><li>10 projects</li><li>Email support</li></ul>
      <button>Choose plan</button>
    </div>
    <div class="plan">
      <p class="plan-name">Scale</p>
      <p class="plan-price">$79/mo</p>
      <ul><li>Unlimited projects</li><li>Priority support</li></ul>
      <button>Choose plan</button>
    </div>
  </div>
</body>
</html>
