<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before</title>
<style>
  body {
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    margin: 0;
  }

  header {
    display: flex;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid #e5e7eb;
  }

  .logo {
    font-size: 15px;
    font-weight: 400;
    color: #4f46e5;
    margin-right: 20px;
  }

  nav {
    display: flex;
  }

  nav a {
    font-size: 13px;
    color: #374151;
    text-decoration: none;
    margin-right: 10px;
    padding: 4px;
  }

  nav a:nth-child(2) {
    font-size: 16px;
    font-weight: 700;
    color: #111827;
  }

  .spacer { flex: 1; }

  .cta {
    background: #4f46e5;
    color: white;
    border: none;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 3px;
  }

  .signin {
    color: #4f46e5;
    font-size: 13px;
    text-decoration: underline;
    margin-right: 8px;
  }
</style>
</head>
<body>
  <header>
    <span class="logo">Fieldnote</span>
    <nav>
      <a href="#">Product</a>
      <a href="#">Pricing</a>
      <a href="#">Docs</a>
      <a href="#">Changelog</a>
    </nav>
    <span class="spacer"></span>
    <a class="signin" href="#">Sign in</a>
    <button class="cta">Get started</button>
  </header>
</body>
</html>
